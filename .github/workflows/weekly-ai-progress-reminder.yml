name: Weekly AI progress reminder

on:
  schedule:
    # Asia/Shanghai 周一 09:05（UTC 周一 01:05）
    - cron: "5 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview 只发日志接收人；scheduled 发全部对接人"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - scheduled
      confirm_broadcast:
        description: "手动 scheduled 时必须勾选"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-ai-progress-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_REPORT_USER_OPEN_ID: ${{ secrets.FEISHU_REPORT_USER_OPEN_ID }}
      WEEKLY_AI_PROGRESS_ENABLED: ${{ vars.WEEKLY_AI_PROGRESS_ENABLED }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      CONFIRM_BROADCAST: ${{ inputs.confirm_broadcast }}
      REPORT_PATH: weekly-ai-progress-reminder/artifacts/send-report.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Read Base and send reminders
        run: node weekly-ai-progress-reminder/src/run.mjs

      - name: Upload private send report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-progress-send-report-${{ github.run_id }}
          path: weekly-ai-progress-reminder/artifacts/send-report.json
          if-no-files-found: warn
          retention-days: 90
